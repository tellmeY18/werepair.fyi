name: Container
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: hexpm/elixir:1.18.4-erlang-27.3.4-debian-bookworm-20250428-slim
    env:
      MIX_ENV: test
      MIX_HOME: ${{ github.workspace }}/.nix-mix
      HEX_HOME: ${{ github.workspace }}/.nix-hex
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: apt-get update && apt-get install -y --no-install-recommends build-essential ca-certificates
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .nix-mix
            .nix-hex
            deps
            _build/test
          key: mix-linux-amd64-elixir-1.18.4-otp-27.3.4-v1-${{ hashFiles('mix.lock') }}-${{ github.sha }}
          restore-keys: |
            mix-linux-amd64-elixir-1.18.4-otp-27.3.4-v1-${{ hashFiles('mix.lock') }}-
            mix-linux-amd64-elixir-1.18.4-otp-27.3.4-v1-
      - run: mix local.hex --force && mix local.rebar --force && mix deps.get
      - run: mix compile --warnings-as-errors && mix format --check-formatted && mix test
  image:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/tellmey18/werepair.fyi:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/tellmeY18/werepair.fyi
          cache-from: type=gha
          cache-to: type=gha,mode=max
